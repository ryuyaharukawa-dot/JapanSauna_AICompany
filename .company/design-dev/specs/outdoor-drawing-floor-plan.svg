<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#333"/>
    </marker>
    <marker id="ahR" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 6 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <rect width="900" height="700" fill="#f7f7f7"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="58" fill="#1a4a3a"/>
  <text x="450" y="30" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="bold" fill="white">JapanSauna 屋外キャビン（BtoB）｜ 平面図（上面図）</text>
  <text x="450" y="48" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#aad4c4">Scale 1:50 ／ 単位: mm ／ 2026-03-31 ／ 3〜4人用 屋外キャビン型</text>

  <g transform="translate(130, 130)">

    <!-- Labels -->
    <text x="210" y="-24" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#222">屋外キャビン 3〜4人用</text>
    <text x="210" y="-9" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">外寸 W2,100 × D2,200 × H2,500 ／ 内寸 W1,800 × D1,900 × H2,200</text>

    <!-- Outer walls (サーモウッド tone) -->
    <rect x="0" y="0" width="420" height="440" fill="#8a7060" stroke="#5a4030" stroke-width="1.5"/>
    <!-- Thermowood grain lines on side walls -->
    <line x1="8"  y1="35" x2="8"  y2="405" stroke="#6a5040" stroke-width="0.6" opacity="0.6"/>
    <line x1="16" y1="35" x2="16" y2="405" stroke="#6a5040" stroke-width="0.6" opacity="0.6"/>
    <line x1="24" y1="35" x2="24" y2="405" stroke="#6a5040" stroke-width="0.6" opacity="0.6"/>
    <line x1="396" y1="35" x2="396" y2="405" stroke="#6a5040" stroke-width="0.6" opacity="0.6"/>
    <line x1="404" y1="35" x2="404" y2="405" stroke="#6a5040" stroke-width="0.6" opacity="0.6"/>
    <line x1="412" y1="35" x2="412" y2="405" stroke="#6a5040" stroke-width="0.6" opacity="0.6"/>

    <!-- Interior space -->
    <rect x="30" y="30" width="360" height="380" fill="#fdf8f0"/>

    <!-- Door opening (override front wall to interior color) -->
    <rect x="35" y="410" width="130" height="30" fill="#fdf8f0"/>

    <!-- Panorama window in front wall (blue glass) -->
    <rect x="205" y="410" width="180" height="30" fill="#a8d4ec" stroke="#4488bb" stroke-width="1.5"/>
    <text x="295" y="429" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#1a4a88" font-weight="bold">パノラマ窓（耐熱ダブルガラス）W900</text>

    <!-- Upper bench: back wall, D600=120px, full width -->
    <rect x="30" y="30" width="360" height="120" fill="#d4a870" stroke="#a07030" stroke-width="1"/>
    <text x="210" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#4a2800">上段ベンチ</text>
    <text x="210" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#4a2800">D600 / H1,050mm</text>

    <!-- Lower bench step: D400=80px from back, overlaid darker -->
    <rect x="30" y="30" width="360" height="80" fill="#b88840" stroke="#a07030" stroke-width="0.5"/>
    <text x="210" y="59" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#3a1800">下段 D400 / H450mm</text>

    <!-- Stove 6kW: front-right footwell (300×300mm=60px) -->
    <rect x="316" y="338" width="62" height="62" fill="#4a4a4a" stroke="#222" stroke-width="1" rx="4"/>
    <text x="347" y="364" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" fill="white">ストーブ</text>
    <text x="347" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#88ccff">6kW</text>

    <!-- Fan position (tentative): back wall area -->
    <circle cx="360" cy="52" r="9" fill="none" stroke="#dd3333" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="360" y="69" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#dd3333">ファン(検討)</text>

    <!-- Glass door line + swing arc (front-left) -->
    <line x1="35" y1="410" x2="165" y2="410" stroke="#333" stroke-width="2.5"/>
    <path d="M 165 410 A 130 130 0 0 1 35 280" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>

    <!-- LED strip under upper bench -->
    <line x1="30" y1="151" x2="390" y2="151" stroke="#ffaa00" stroke-width="2.5" stroke-dasharray="7,3"/>

    <!-- Wall spec label (rotated, left wall) -->
    <text x="15" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#fff" transform="rotate(-90,15,225)">サーモウッド外装 ＋ ロックウール100mm（壁厚計 150mm）</text>

    <!-- === DIMENSION LINES === -->

    <!-- Total W2,100 (top) -->
    <line x1="0" y1="-36" x2="420" y2="-36" stroke="#333" stroke-width="0.9" marker-start="url(#ahR)" marker-end="url(#ah)"/>
    <rect x="168" y="-46" width="84" height="14" fill="#f7f7f7"/>
    <text x="210" y="-36" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">W 2,100</text>

    <!-- Interior W1,800 (top, inner) -->
    <line x1="30" y1="-18" x2="390" y2="-18" stroke="#a07030" stroke-width="0.8" marker-start="url(#ahR)" marker-end="url(#ah)"/>
    <rect x="172" y="-27" width="76" height="13" fill="#f7f7f7"/>
    <text x="210" y="-18" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a07030">W 1,800（内寸）</text>

    <!-- Total D2,200 (left) -->
    <line x1="-40" y1="0" x2="-40" y2="440" stroke="#333" stroke-width="0.9" marker-start="url(#ahR)" marker-end="url(#ah)"/>
    <text x="-56" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333" transform="rotate(-90,-56,225)">D 2,200</text>

    <!-- Bench D600 (right) -->
    <line x1="430" y1="30" x2="430" y2="150" stroke="#a07030" stroke-width="0.8" marker-start="url(#ahR)" marker-end="url(#ah)"/>
    <text x="446" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a07030" transform="rotate(-90,446,95)">D 600</text>

    <!-- Bench D400 (right, offset) -->
    <line x1="448" y1="30" x2="448" y2="110" stroke="#886622" stroke-width="0.8" marker-start="url(#ahR)" marker-end="url(#ah)"/>
    <text x="464" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#886622" transform="rotate(-90,464,73)">D 400</text>

    <!-- Entry label -->
    <text x="210" y="464" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#555">▼ 前面（ガラスドア + パノラマ窓）</text>

    <!-- North / back label -->
    <text x="210" y="-55" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#999">▲ 背面（奥壁）</text>

  </g>

  <!-- Legend -->
  <rect x="40" y="615" width="820" height="58" fill="white" stroke="#ddd" stroke-width="1" rx="4"/>
  <text x="60" y="634" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#333">凡例</text>

  <rect x="60" y="641" width="12" height="9" fill="#8a7060" stroke="#5a4030"/>
  <text x="78" y="650" font-family="Arial,sans-serif" font-size="9" fill="#333">サーモウッド外壁（断熱構造 150mm）</text>
  <rect x="255" y="641" width="12" height="9" fill="#d4a870" stroke="#a07030"/>
  <text x="273" y="650" font-family="Arial,sans-serif" font-size="9" fill="#333">上段ベンチ（D600/H1,050）</text>
  <rect x="430" y="641" width="12" height="9" fill="#b88840" stroke="#a07030"/>
  <text x="448" y="650" font-family="Arial,sans-serif" font-size="9" fill="#333">下段ベンチ（D400/H450）</text>
  <rect x="595" y="641" width="12" height="9" fill="#a8d4ec" stroke="#4488bb"/>
  <text x="613" y="650" font-family="Arial,sans-serif" font-size="9" fill="#333">パノラマガラス窓</text>
  <rect x="720" y="641" width="12" height="9" fill="#4a4a4a" rx="2"/>
  <text x="738" y="650" font-family="Arial,sans-serif" font-size="9" fill="#333">ストーブ 6kW</text>

  <circle cx="68" cy="661" r="7" fill="none" stroke="#dd3333" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="81" y="665" font-family="Arial,sans-serif" font-size="9" fill="#333">ファン（特許調査中）</text>
  <line x1="200" y1="661" x2="228" y2="661" stroke="#ffaa00" stroke-width="2.5" stroke-dasharray="7,3"/>
  <text x="234" y="665" font-family="Arial,sans-serif" font-size="9" fill="#333">LED照明（ベンチ下）</text>

  <text x="450" y="688" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#aaa">※ 本図は設計検討用の参考図です。正式施工図は CAD にて別途作成してください。</text>
</svg>
