<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660">
  <defs>
    <marker id="ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#333"/>
    </marker>
    <marker id="ahR" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 6 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <rect width="900" height="660" fill="#f7f7f7"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="58" fill="#3a2a1a"/>
  <text x="450" y="30" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="bold" fill="white">JapanSauna スクエアバレルサウナ｜ 平面図（上面図）</text>
  <text x="450" y="48" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#d4b896">Scale 1:10 ／ 単位: mm ／ 2026-03-31 ／ 断熱強化モデル（壁75mm・天井100mm・床50mm）</text>

  <!-- ===== M SIZE ===== -->
  <!-- 1px = 10mm : W1800=180px D1500=150px wall=12px rx=28 -->
  <g transform="translate(80, 140)">

    <text x="90" y="-24" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#222">M サイズ</text>
    <text x="90" y="-9" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#666">W1,800 × D1,500 × H1,800 ／ 2名ゆったり</text>

    <!-- Outer wall (サーモウッド) - rounded corners -->
    <rect x="0" y="0" width="180" height="150" rx="28" fill="#8a7060" stroke="#5a4030" stroke-width="1.5"/>
    <!-- Thermowood grain hint -->
    <line x1="7"  y1="35" x2="7"  y2="115" stroke="#6a5040" stroke-width="0.6" opacity="0.5"/>
    <line x1="14" y1="20" x2="14" y2="130" stroke="#6a5040" stroke-width="0.6" opacity="0.5"/>
    <line x1="166" y1="20" x2="166" y2="130" stroke="#6a5040" stroke-width="0.6" opacity="0.5"/>
    <line x1="173" y1="35" x2="173" y2="115" stroke="#6a5040" stroke-width="0.6" opacity="0.5"/>

    <!-- Interior space -->
    <rect x="12" y="12" width="156" height="126" rx="16" fill="#fdf8f0"/>

    <!-- Left bench (facing, along left wall) -->
    <rect x="12" y="12" width="40" height="126" rx="4" fill="#d4a870" stroke="#a07030" stroke-width="1"/>
    <text x="32" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#4a2800" transform="rotate(-90,32,72)">ベンチ D400</text>

    <!-- Right bench (facing) -->
    <rect x="128" y="12" width="40" height="126" rx="4" fill="#d4a870" stroke="#a07030" stroke-width="1"/>
    <text x="148" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#4a2800" transform="rotate(90,148,72)">ベンチ D400</text>

    <!-- Central pillar stove -->
    <circle cx="90" cy="75" r="14" fill="#4a4a4a" stroke="#222" stroke-width="1.2"/>
    <text x="90" y="71" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" fill="white">柱型</text>
    <text x="90" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#88ccff">6kW</text>
    <!-- Heat radiation dashed rings -->
    <circle cx="90" cy="75" r="22" fill="none" stroke="#ff8800" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5"/>
    <circle cx="90" cy="75" r="32" fill="none" stroke="#ff8800" stroke-width="0.6" stroke-dasharray="3,3" opacity="0.3"/>

    <!-- Glass door (front, bottom) -->
    <rect x="50" y="138" width="80" height="12" rx="2" fill="#a8d4ec" stroke="#4488bb" stroke-width="1.2"/>
    <text x="90" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#1a4a88">ガラスドア W800</text>

    <!-- Wall thickness label -->
    <text x="6" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" fill="#fff" transform="rotate(-90,6,78)">外壁120mm断熱</text>

    <!-- === DIMENSIONS === -->
    <!-- W1800 top -->
    <line x1="0" y1="-35" x2="180" y2="-35" stroke="#333" stroke-width="0.9" marker-start="url(#ahR)" marker-end="url(#ah)"/>
    <rect x="65" y="-45" width="50" height="14" fill="#f7f7f7"/>
    <text x="90" y="-35" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">W 1,800</text>

    <!-- D1500 left -->
    <line x1="-35" y1="0" x2="-35" y2="150" stroke="#333" stroke-width="0.9" marker-start="url(#ahR)" marker-end="url(#ah)"/>
    <text x="-50" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333" transform="rotate(-90,-50,80)">D 1,500</text>

    <!-- Bench D400 (right) -->
    <line x1="192" y1="12" x2="192" y2="52" stroke="#a07030" stroke-width="0.8" marker-start="url(#ahR)" marker-end="url(#ah)"/>
    <text x="208" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a07030" transform="rotate(-90,208,34)">D 400</text>

    <!-- Center stove space -->
    <line x1="192" y1="52" x2="192" y2="98" stroke="#888" stroke-width="0.8" marker-start="url(#ahR)" marker-end="url(#ah)"/>
    <text x="210" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#888" transform="rotate(-90,210,78)">780</text>

    <!-- Entry label -->
    <text x="90" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#555">▼ 前面（ガラスドア）</text>

  </g>

  <!-- ===== L SIZE ===== -->
  <!-- 1px = 10mm : W2000=200px D1800=180px wall=12px rx=32 -->
  <g transform="translate(430, 125)">

    <text x="100" y="-24" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#222">L サイズ</text>
    <text x="100" y="-9" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#666">W2,000 × D1,800 × H2,000 ／ 3〜4名</text>

    <!-- Outer wall (サーモウッド) -->
    <rect x="0" y="0" width="200" height="180" rx="32" fill="#8a7060" stroke="#5a4030" stroke-width="1.5"/>
    <line x1="8"  y1="42" x2="8"  y2="138" stroke="#6a5040" stroke-width="0.6" opacity="0.5"/>
    <line x1="16" y1="22" x2="16" y2="158" stroke="#6a5040" stroke-width="0.6" opacity="0.5"/>
    <line x1="184" y1="22" x2="184" y2="158" stroke="#6a5040" stroke-width="0.6" opacity="0.5"/>
    <line x1="192" y1="42" x2="192" y2="138" stroke="#6a5040" stroke-width="0.6" opacity="0.5"/>

    <!-- Interior space -->
    <rect x="12" y="12" width="176" height="156" rx="20" fill="#fdf8f0"/>

    <!-- Left bench -->
    <rect x="12" y="12" width="45" height="156" rx="4" fill="#d4a870" stroke="#a07030" stroke-width="1"/>
    <text x="34" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#4a2800" transform="rotate(-90,34,85)">ベンチ D450</text>

    <!-- Right bench -->
    <rect x="143" y="12" width="45" height="156" rx="4" fill="#d4a870" stroke="#a07030" stroke-width="1"/>
    <text x="165" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#4a2800" transform="rotate(90,165,85)">ベンチ D450</text>

    <!-- Central pillar stove -->
    <circle cx="100" cy="90" r="16" fill="#4a4a4a" stroke="#222" stroke-width="1.2"/>
    <text x="100" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" fill="white">柱型</text>
    <text x="100" y="97" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#88ccff">6〜9kW</text>
    <circle cx="100" cy="90" r="26" fill="none" stroke="#ff8800" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.5"/>
    <circle cx="100" cy="90" r="38" fill="none" stroke="#ff8800" stroke-width="0.6" stroke-dasharray="3,3" opacity="0.3"/>

    <!-- Glass door (front) -->
    <rect x="55" y="168" width="90" height="12" rx="2" fill="#a8d4ec" stroke="#4488bb" stroke-width="1.2"/>
    <text x="100" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#1a4a88">ガラスドア W900</text>

    <!-- Wall label -->
    <text x="6" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" fill="#fff" transform="rotate(-90,6,95)">外壁120mm断熱</text>

    <!-- W2000 top -->
    <line x1="0" y1="-35" x2="200" y2="-35" stroke="#333" stroke-width="0.9" marker-start="url(#ahR)" marker-end="url(#ah)"/>
    <rect x="75" y="-45" width="50" height="14" fill="#f7f7f7"/>
    <text x="100" y="-35" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">W 2,000</text>

    <!-- D1800 left -->
    <line x1="-35" y1="0" x2="-35" y2="180" stroke="#333" stroke-width="0.9" marker-start="url(#ahR)" marker-end="url(#ah)"/>
    <text x="-50" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333" transform="rotate(-90,-50,95)">D 1,800</text>

    <!-- Bench D450 (right) -->
    <line x1="213" y1="12" x2="213" y2="57" stroke="#a07030" stroke-width="0.8" marker-start="url(#ahR)" marker-end="url(#ah)"/>
    <text x="229" y="37" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#a07030" transform="rotate(-90,229,37)">D 450</text>

    <line x1="213" y1="57" x2="213" y2="123" stroke="#888" stroke-width="0.8" marker-start="url(#ahR)" marker-end="url(#ah)"/>
    <text x="247" y="93" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#888" transform="rotate(-90,247,93)">880</text>

    <text x="100" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#555">▼ 前面（ガラスドア）</text>

  </g>

  <!-- Feature callouts (bottom) -->
  <rect x="40" y="440" width="820" height="185" fill="white" stroke="#ddd" stroke-width="1" rx="6"/>
  <text x="450" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#3a2a1a">スクエアバレル 断熱強化モデル ｜ 3つの差別化ポイント</text>
  <line x1="60" y1="472" x2="840" y2="472" stroke="#eee" stroke-width="1"/>

  <!-- Point 1 -->
  <rect x="60" y="482" width="240" height="125" fill="#fffaf5" stroke="#d4a060" stroke-width="1" rx="4"/>
  <text x="180" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#3a2a1a">① 断熱性能</text>
  <text x="75" y="518" font-family="Arial,sans-serif" font-size="9" fill="#444">壁：ロックウール 75mm</text>
  <text x="75" y="533" font-family="Arial,sans-serif" font-size="9" fill="#444">天井：ロックウール 100mm</text>
  <text x="75" y="548" font-family="Arial,sans-serif" font-size="9" fill="#444">床下：ロックウール 50mm</text>
  <text x="75" y="563" font-family="Arial,sans-serif" font-size="9" fill="#888">→ 一般バレルサウナ（断熱なし）と比べ</text>
  <text x="75" y="576" font-family="Arial,sans-serif" font-size="9" fill="#888">  昇温時間・保温性が大幅に向上</text>
  <text x="75" y="597" font-family="Arial,sans-serif" font-size="8.5" fill="#c07000" font-weight="bold">外装：サーモウッド（熱処理木材）採用</text>

  <!-- Point 2 -->
  <rect x="320" y="482" width="240" height="125" fill="#fff8f5" stroke="#ff8844" stroke-width="1" rx="4"/>
  <text x="440" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#3a2a1a">② 足元まで温まる</text>
  <text x="335" y="518" font-family="Arial,sans-serif" font-size="9" fill="#444">中央柱型ストーブが360°熱放射</text>
  <text x="335" y="533" font-family="Arial,sans-serif" font-size="9" fill="#444">床面への輻射熱が直接届く構造</text>
  <text x="335" y="548" font-family="Arial,sans-serif" font-size="9" fill="#444">床下ロックウール50mmで冷気を遮断</text>
  <text x="335" y="563" font-family="Arial,sans-serif" font-size="9" fill="#888">→ 「65度問題」「足元が冷たい」</text>
  <text x="335" y="576" font-family="Arial,sans-serif" font-size="9" fill="#888">  を構造で解決</text>
  <text x="335" y="597" font-family="Arial,sans-serif" font-size="8.5" fill="#c04400" font-weight="bold">下段ベンチH450mm：足元の熱を体感</text>

  <!-- Point 3 -->
  <rect x="580" y="482" width="240" height="125" fill="#f5f8ff" stroke="#4488bb" stroke-width="1" rx="4"/>
  <text x="700" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#3a2a1a">③ 耐久性</text>
  <text x="595" y="518" font-family="Arial,sans-serif" font-size="9" fill="#444">サーモウッド外装：腐食・UV劣化に強い</text>
  <text x="595" y="533" font-family="Arial,sans-serif" font-size="9" fill="#444">SUS304防水パン：高温・高湿に耐性</text>
  <text x="595" y="548" font-family="Arial,sans-serif" font-size="9" fill="#444">透湿防水シート：外気・雨水の侵入防止</text>
  <text x="595" y="563" font-family="Arial,sans-serif" font-size="9" fill="#888">→ 海外製バレルサウナ（2〜3年で劣化）</text>
  <text x="595" y="576" font-family="Arial,sans-serif" font-size="9" fill="#888">  の弱点を素材から解決</text>
  <text x="595" y="597" font-family="Arial,sans-serif" font-size="8.5" fill="#1a4a88" font-weight="bold">目標耐用年数：10年以上</text>

  <text x="450" y="645" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#aaa">※ 本図は設計検討用の参考図です。正式施工図は CAD にて別途作成してください。</text>
</svg>
