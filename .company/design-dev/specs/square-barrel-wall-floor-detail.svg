  <text x="410" y="48" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#d4b896">Scale 1:10 ／ 単位: mm ／ 2026-03-31（1mm = 2px 表示）</text>

