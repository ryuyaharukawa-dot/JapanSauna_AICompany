    <text x="10" y="220" font-family="Arial,sans-serif" font-size="8.5" fill="#888">一般バレル：断熱材なし</text>
    <text x="10" y="232" font-family="Arial,sans-serif" font-size="8.5" fill="#1a4a3a" font-weight="bold">本モデル：全3方向断熱あり</text>
    <text x="10" y="246" font-family="Arial,sans-serif" font-size="8" fill="#c04400">→ 昇温速度・保温性が大幅向上</text>

  </g>

  <!-- Footer -->
  <text x="410" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#aaa">※ 接着には耐熱ネタボンド使用（白ボンド・速乾ボンド禁止）。ジョイント部・貫通部は気密テープで完全シール。サーモウッド外装は木口面に防水コーティングを施す。</text>
</svg>
